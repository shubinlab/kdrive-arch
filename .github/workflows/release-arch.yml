name: Arch release

on:
  push:
    tags:
      - 'arch-*'
      - 'kdrive-arch-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check package identity for new release tags
        if: startsWith(github.ref, 'refs/tags/kdrive-arch-')
        run: |
          pkgver="$(awk -F= '$1 == "pkgver" {print $2; exit}' PKGBUILD)"
          pkgrel="$(awk -F= '$1 == "pkgrel" {print $2; exit}' PKGBUILD)"
          expected="kdrive-arch-${pkgver}-${pkgrel}"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Build release assets
        run: |
          git archive --format=tar.gz --prefix=kdrive-arch/ HEAD > kdrive-arch-source.tar.gz
          sha256sum install.sh kdrive-arch-source.tar.gz > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            install.sh
            kdrive-arch-source.tar.gz
            SHA256SUMS
