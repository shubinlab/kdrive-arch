name: Arch release

on:
  push:
    tags:
      - 'arch-*'
      - 'kdrive-arch-*'

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create deterministic source archive
        run: git -C "$GITHUB_WORKSPACE" archive --format=tar --prefix=kdrive-arch/ HEAD | gzip -n >kdrive-arch-source.tar.gz
      - name: Upload source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-tree
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Download source tree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-tree
          path: .

      - name: Check package identity for new release tags
        run: |
          pkgver="$(awk -F= '$1 == "pkgver" {print $2; exit}' PKGBUILD)"
          pkgrel="$(awk -F= '$1 == "pkgrel" {print $2; exit}' PKGBUILD)"
          case "$GITHUB_REF_NAME" in
            kdrive-arch-*) expected="kdrive-arch-${pkgver}-${pkgrel}" ;;
            arch-*) expected="arch-${pkgver}-${pkgrel}" ;;
            *) exit 0 ;;
          esac
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Prepare Arch build environment
        run: |
          mapfile -t build_dependencies < <(
            awk -F' = ' '/^\t(depends|makedepends) = / {print $2}' .SRCINFO | sort -u
          )
          pacman -Syu --needed --noconfirm git ripgrep "${build_dependencies[@]}"
          chmod +x "$GITHUB_WORKSPACE/install.sh" "$GITHUB_WORKSPACE/build/"*.sh "$GITHUB_WORKSPACE/tests/"*.sh
          useradd --create-home builder
          build_root=/tmp/kdrive-workspace
          rm -rf -- "$build_root"
          mkdir -p -- "$build_root"
          cp -a -- "$GITHUB_WORKSPACE"/. "$build_root"/
          chown -R builder:builder "$build_root"
          chmod -R a+rX "$build_root"
          printf 'BUILD_ROOT=%s\n' "$build_root" >>"$GITHUB_ENV"

      - name: Check repository contracts
        run: |
          "$GITHUB_WORKSPACE/tests/test-pkgbuild-contract.sh" "$GITHUB_WORKSPACE/PKGBUILD"
          "$GITHUB_WORKSPACE/tests/test-build-output-contract.sh" "$GITHUB_WORKSPACE/build/build-package.sh"
          "$GITHUB_WORKSPACE/tests/test-package-name-contract.sh"
          "$GITHUB_WORKSPACE/tests/test-repository-contract.sh"
          "$GITHUB_WORKSPACE/tests/test-release-workflow-contract.sh" "$GITHUB_WORKSPACE/.github/workflows/release-arch.yml"
          runuser -u builder -- makepkg --printsrcinfo --dir "$BUILD_ROOT" | diff -u "$GITHUB_WORKSPACE/.SRCINFO" -

      - name: Build package and debug symbols
        run: runuser -u builder -- env HOME=/home/builder makepkg --noconfirm --cleanbuild --dir "$BUILD_ROOT"

      - name: Stage deterministic release assets
        shell: bash
        run: |
          pkgver="$(awk -F= '$1 == "pkgver" {print $2; exit}' "$BUILD_ROOT/PKGBUILD")"
          pkgrel="$(awk -F= '$1 == "pkgrel" {print $2; exit}' "$BUILD_ROOT/PKGBUILD")"
          package_asset="kdrive-arch-${pkgver}-${pkgrel}-x86_64.pkg.tar.zst"
          debug_source="$BUILD_ROOT/src/dist/kdrive-${pkgver}-arch-debug.tar.gz"
          debug_asset="kdrive-arch-${pkgver}-${pkgrel}-debug.tar.gz"

          package_asset="$BUILD_ROOT/$package_asset"
          package_name="$(basename "$package_asset")"
          test -f "$package_asset"
          test -f "$debug_source"
          mkdir -p -- "$GITHUB_WORKSPACE/release"
          install -D -m 0644 "$package_asset" "$GITHUB_WORKSPACE/release/$(basename "$package_asset")"
          install -m 0644 "$debug_source" "$GITHUB_WORKSPACE/release/$debug_asset"
          install -m 0755 "$BUILD_ROOT/install.sh" "$GITHUB_WORKSPACE/release/install.sh"
          install -m 0644 "$GITHUB_WORKSPACE/kdrive-arch-source.tar.gz" \
            "$GITHUB_WORKSPACE/release/kdrive-arch-source.tar.gz"
          (
            cd "$GITHUB_WORKSPACE/release"
            sha256sum \
              "$package_name" \
              "$debug_asset" \
              kdrive-arch-source.tar.gz \
              install.sh >SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload release assets for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release

      - name: Verify transferred release assets
        run: cd release && sha256sum -c SHA256SUMS

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
