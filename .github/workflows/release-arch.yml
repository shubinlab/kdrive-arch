name: Arch release

on:
  push:
    tags:
      - 'arch-*'
      - 'kdrive-arch-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release assets
        run: |
          git archive --format=tar.gz --prefix=kdrive-arch/ HEAD > kdrive-arch-source.tar.gz
          sha256sum install.sh kdrive-arch-source.tar.gz > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            install.sh
            kdrive-arch-source.tar.gz
            SHA256SUMS
