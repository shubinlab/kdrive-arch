name: Arch package contract

on:
  push:
    paths:
      - 'PKGBUILD'
      - '.SRCINFO'
      - 'build/**'
      - 'tests/**'
      - 'README.md'
      - 'install.sh'
      - 'kdrive-arch.in'
      - 'kdrive.service'
      - '.github/workflows/arch-package-contract.yml'
      - '.github/workflows/release-arch.yml'
  pull_request:
    paths:
      - 'PKGBUILD'
      - '.SRCINFO'
      - 'build/**'
      - 'tests/**'
      - 'README.md'
      - 'install.sh'
      - 'kdrive-arch.in'
      - 'kdrive.service'
      - '.github/workflows/arch-package-contract.yml'
      - '.github/workflows/release-arch.yml'

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-tree
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  contract:
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-tree
          path: .
      - name: Install metadata tools
        run: pacman -Sy --noconfirm curl git ripgrep
      - name: Check shell and package metadata
        run: |
          bash -n PKGBUILD \
            tests/check-package.sh \
            tests/test-desktop-contract.sh \
            tests/test-build-output-contract.sh \
            tests/test-pkgbuild-contract.sh \
            tests/test-repository-contract.sh \
            tests/test-installer-contract.sh \
            tests/test-package-name-contract.sh \
            tests/test-release-workflow-contract.sh \
            tests/test-installer-redteam.sh \
            build/build-package.sh
          tests/test-pkgbuild-contract.sh PKGBUILD
          tests/test-build-output-contract.sh build/build-package.sh
          tests/test-package-name-contract.sh
          tests/test-release-workflow-contract.sh .github/workflows/release-arch.yml
          tests/test-installer-redteam.sh
          makepkg --printsrcinfo --dir "$GITHUB_WORKSPACE" | diff -u "$GITHUB_WORKSPACE/.SRCINFO" -
      - name: Check OAuth desktop contract
        run: |
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Exec=kDrive %u' \
            'MimeType=x-scheme-handler/kdrive;' >/tmp/kdrive.desktop
          tests/test-desktop-contract.sh /tmp/kdrive.desktop
